server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: onlinepandit-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/onlinepandit?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:pandit}
    password: ${SPRING_DATASOURCE_PASSWORD:localdev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  ai:
    model:
      chat: ${AI_MODEL_CHAT:none}
    openai:
      api-key: ${OPENAI_API_KEY:}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
resilience4j:
  circuitbreaker:
    instances:
      aiAssistant:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
      mailDelivery:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
app:
  payments:
    platform-fee-bps: ${PLATFORM_FEE_BPS:1000}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      success-url: ${PAYMENT_SUCCESS_URL:http://localhost:5173/?payment=success}
      cancel-url: ${PAYMENT_CANCEL_URL:http://localhost:5173/?payment=cancelled}
      connect-webhook-secret: ${STRIPE_CONNECT_WEBHOOK_SECRET:}
      connect-refresh-url: ${STRIPE_CONNECT_REFRESH_URL:http://localhost:5173/?connect=refresh}
      connect-return-url: ${STRIPE_CONNECT_RETURN_URL:http://localhost:5173/?connect=return}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@onlinepandit.example}
  sms:
    enabled: ${SMS_ENABLED:false}
    reminders-enabled: ${SMS_REMINDERS_ENABLED:false}
    reminder-cron: ${SMS_REMINDER_CRON:0 */15 8-20 * * *}
    reminder-zone: ${SMS_REMINDER_ZONE:UTC}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
  ai:
    enabled: ${AI_ENABLED:false}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  jwt:
    secret: ${JWT_SECRET:b25saW5lcGFuZGl0LWxvY2FsLXNlY3JldC0zMi1ieXRlcy1sZW5ndGg=}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
